# Builds the site as static files and publishes it to GitHub Pages:
#   https://saurabhgithug.github.io/Class/
# Runs on every push to main, and can be started by hand from the Actions tab.
# See next.config.ts for what the GitHub Pages build changes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the tests
        run: npm test

      # Pages has no server: the admin panel and ContentSathi receiver cannot run there, and a static
      # export cannot have an empty blog-post route. Both are removed in this build only.
      # Pages serves the built-in content only; the admin panel needs the Vercel deployment.
      - name: Remove server-only routes
        run: |
          rm -rf app/api app/admin proxy.ts components/admin lib/admin-auth.ts lib/admin-data.ts
          if ! ls content/blog/*.json >/dev/null 2>&1; then rm -rf "app/(site)/blog/[slug]"; fi

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://saurabhgithug.github.io/Class

      # Without this file GitHub Pages hides the _next/ folder.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
